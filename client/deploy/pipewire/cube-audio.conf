# Standalone CLIENT of the existing audio server, never pipewire.conf.d.
# WirePlumber follows the selected default physical sink for both output streams.
# Shared link-group prevents either output feeding either Cube virtual sink.
context.properties = { log.level = 2 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Cube Spotify"
            media.name = "Cube Spotify"
            filter.graph = {
                nodes = [
                    { type = builtin name = duck_left label = linear
                      control = { Mult = 0.10 Add = 0.0 } }
                    { type = builtin name = duck_right label = linear
                      control = { Mult = 0.10 Add = 0.0 } }
                ]
                inputs = [ "duck_left:In" "duck_right:In" ]
                outputs = [ "duck_left:Out" "duck_right:Out" ]
            }
            capture.props = {
                node.name = "cube.spotify"
                cube.audio.bus = "spotify"
                node.link-group = "cube.audio"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
                node.virtual = true
                priority.session = 0
                state.restore-props = false
            }
            playback.props = {
                node.name = "cube.spotify.output"
                node.link-group = "cube.audio"
                audio.position = [ FL FR ]
                node.passive = true
                node.dont-move = false
                state.restore-props = false
                state.restore-target = false
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Cube Assistant"
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "cube.assistant"
                application.id = "cube.assistant.bus"
                application.name = "Cube Assistant Bus"
                cube.audio.bus = "assistant"
                node.link-group = "cube.audio"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
                node.virtual = true
                priority.session = 0
                state.restore-props = true
                state.restore-target = false
                state.default-volume = 1.0
            }
            playback.props = {
                node.name = "cube.assistant.output"
                node.link-group = "cube.audio"
                audio.position = [ FL FR ]
                node.passive = true
                node.dont-move = false
                state.restore-props = false
                state.restore-target = false
            }
        }
    }
]
