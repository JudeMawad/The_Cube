name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: client
            requirements: client
            pythonpath: client/app
          - suite: server
            requirements: server
            pythonpath: server
          - suite: ai_node
            requirements: ai-node
            pythonpath: ''
          - suite: integration
            requirements: integration
            pythonpath: 'server:client/app'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements-*.txt
      - run: python -m pip install -r tests/requirements-${{ matrix.requirements }}.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests/${{ matrix.suite }} -t . -v
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          PYTHONDONTWRITEBYTECODE: '1'
          CUBE_AI_NODE_URL: ''
          CUBE_LOG_TRANSCRIPTS: ''
      - run: python scripts/build_voice_catalog.py --check
      - run: python scripts/check_docs.py
