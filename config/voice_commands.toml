# CANONICAL VOICE COMMANDS
# ========================
# Edit this file, then regenerate the service-local JSON snapshots:
#   python3 scripts/build_voice_catalog.py
#
# Each [[commands]] block defines one existing command.
# - exact: phrases that must match exactly (after existing normalization).
# - [[commands.patterns]]: regular expressions used by existing handlers.
# - examples: documentation for a pattern; NOT additional recognized aliases.
# - fast_path: a pattern's existing eligibility flag, not a new execution rule.
#
# IMPORTANT: Keep pattern expressions and capture groups intact when editing.
# Adding words to "examples" does NOT teach the Cube a new command.
# Cube, named-light, and plug controls below work without the AI node.
# Explicit Spotify controls use the catalog-backed backend music tools.

version = 1


# ============================================================
# SERVER / LIGHTS
# ============================================================

# --- Turn lights ON ------------------------------------------
[[commands]]
service = "server"
feature = "lights"
id = "power_on"

[[commands.patterns]]
label = "complete power-on request"
mode = "fullmatch"
fast_path = true
examples = [
  "lights on",
  "turn on the lights",
]
regex = '(?:turn|switch)?\s*(?:the\s+)?(?:lights?|bulbs?|spots?)\s+on|(?:turn|switch)\s+on\s+(?:the\s+)?(?:lights?|bulbs?|spots?)'


# --- Turn lights OFF -----------------------------------------
[[commands]]
service = "server"
feature = "lights"
id = "power_off"

[[commands.patterns]]
label = "complete power-off request"
mode = "fullmatch"
fast_path = true
examples = [
  "lights off",
  "turn off the lights",
]
regex = '(?:turn|switch)?\s*(?:the\s+)?(?:lights?|bulbs?|spots?)\s+off|(?:turn|switch)\s+off\s+(?:the\s+)?(?:lights?|bulbs?|spots?)'


# --- Set light brightness ------------------------------------
[[commands]]
service = "server"
feature = "lights"
id = "brightness"

# Existing legacy matcher: finds a brightness percentage in longer text.
[[commands.patterns]]
label = "legacy brightness extraction"
mode = "search"
regex = '(?:lights?|bulbs?|spots?).*?(\d{1,3})\s*(?:%|percent)'

# Existing fast path: matches a complete, unambiguous request.
[[commands.patterns]]
label = "complete brightness request"
mode = "fullmatch"
fast_path = true
examples = [
  "lights 1%",
  "lights 100 percent",
]
regex = '(?:(?:set|make|dim)\s+)?(?:the\s+)?(?:lights?|bulbs?|spots?)\s+(?:to\s+)?(?:[1-9]|[1-9]\d|100)\s*(?:%|percent)'


# --- Set light color -----------------------------------------
[[commands]]
service = "server"
feature = "lights"
id = "color"

target_words = [
  "light", "lights", "bulb", "bulbs", "spot", "spots",
]

colors = [
  "red", "green", "blue", "white", "yellow",
  "orange", "purple", "pink", "cyan",
]

# NOTE: The existing fast-path regex also names the colors explicitly.
# Editing the colors list alone may not change fast-path recognition.
[[commands.patterns]]
label = "complete color request"
mode = "fullmatch"
fast_path = true
examples = [
  "make the lights blue",
  "set the lights to red",
]
regex = '(?:(?:make|set|turn)\s+(?:the\s+)?(?:lights?|bulbs?|spots?)\s+(?:to\s+)?)(?:blue|cyan|green|orange|pink|purple|red|white|yellow)'


# ============================================================
# SERVER / NAMED LIGHTS AND GROUPS
# ============================================================

# --- Power for one light or a group --------------------------
# Named captures are tool arguments; keep target and state intact.
# "smart life" and "small" map to the Tuya group; mushroom lamp maps to mushroom.
[[commands]]
service = "server"
feature = "light_targets"
id = "set_power"

[[commands.patterns]]
label = "state before named light or group"
mode = "fullmatch"
fast_path = true
examples = ["turn off the mirror", "turn on the mushroom lamp", "switch off the lamp plug", "turn on the govee", "turn on the small lights", "turn off the smart life lights", "turn on all lights"]
regex = '(?:turn|switch) (?P<state>on|off) (?:the )?(?P<target>lamp|mirror|mushroom|govee|tuya|small|smart life|all)(?: lamp| lights?| plugs?)?'

[[commands.patterns]]
label = "state after named light or group"
mode = "fullmatch"
fast_path = true
examples = ["mirror off", "turn the mushroom lamp on", "switch the small lights off", "set the lamp to on", "all lights off"]
regex = '(?:(?:turn|switch|set) )?(?:the )?(?P<target>lamp|mirror|mushroom|govee|tuya|small|smart life|all)(?: lamp| lights?| plugs?)? (?:to )?(?P<state>on|off)'


# ============================================================
# SERVER / PLUG STATE
# ============================================================

[[commands]]
service = "server"
feature = "plugs"
id = "get_state"

[[commands.patterns]]
label = "named plug state question"
mode = "fullmatch"
fast_path = true
examples = ["is the lamp plug on", "is the mirror off", "is the mushroom lamp on", "is the mirror light on"]
regex = 'is (?:the )?(?P<plug>lamp|mirror|mushroom)(?: lamp| light| plug)? (?:on|off)'

[[commands.patterns]]
label = "named plug status request"
mode = "fullmatch"
fast_path = true
examples = ["check the lamp plug", "status of the mirror", "what is the state of the mushroom lamp"]
regex = '''(?:check|status of|what is the state of|what's the state of) (?:the )?(?P<plug>lamp|mirror|mushroom)(?: lamp| light| plug)?'''


# ============================================================
# SERVER / CUBE DISPLAY AND SYSTEM
# ============================================================

# These operate on Cube itself, never household lights or the backend.
# Display off leaves voice listening enabled.
[[commands]]
service = "server"
feature = "cube"
id = "display_on"
fast_path_exact = true
exact = ["turn on your display", "turn the display on", "turn your display on", "enable your display", "turn on the cube display", "turn the cube display on", "cube display on", "display on"]

[[commands]]
service = "server"
feature = "cube"
id = "display_off"
fast_path_exact = true
exact = ["turn off your display", "turn the display off", "turn your display off", "disable your display", "turn off the cube display", "turn the cube display off", "cube display off", "display off"]

[[commands]]
service = "server"
feature = "cube"
id = "set_brightness"

# Whole-number percentages only; invalid numbers prompt for clarification.
[[commands.patterns]]
label = "cube master display brightness"
mode = "fullmatch"
fast_path = true
examples = ["set your display brightness to 20 percent", "set the cube brightness to 0%", "cube display brightness 100%", "set your display to 50 percent"]
regex = '(?:(?:set|make|dim) )?(?:your (?:display(?: brightness)?|brightness)|(?:the )?cube (?:display(?: brightness)?|brightness)) (?:to )?(?P<percent>[+-]?\d[\d.,]*)\s*(?:%|percent)?'

[[commands.patterns]]
label = "malformed numeric setting guard"
mode = "fullmatch"
regex = '(?:(?:set|make|dim) )?(?:your (?:display(?: brightness)?|brightness)|(?:the )?cube (?:display(?: brightness)?|brightness)) (?:to )?(?P<percent>[+-]?\d.*)'

[[commands]]
service = "server"
feature = "cube"
id = "reboot"
fast_path_exact = true
exact = ["reboot cube", "reboot the cube", "restart cube", "restart the cube", "reboot yourself", "restart yourself", "reboot"]

[[commands]]
service = "server"
feature = "cube"
id = "shutdown"
fast_path_exact = true
exact = ["shut down cube", "shut down the cube", "shutdown cube", "shutdown the cube", "power off cube", "power off the cube", "shut yourself down", "turn yourself off", "shutdown"]

[[commands]]
service = "server"
feature = "cube"
id = "get_status"
fast_path_exact = true
exact = ["cube status", "check cube status", "check the cube status", "what is your status", "what's your status", "what is your display status", "what's your display status", "is your display on", "is your display off", "what is your display brightness", "what's your display brightness"]


