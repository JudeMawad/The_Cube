# ============================================================
# SERVER / SPOTIFY MUSIC — deterministic controls and named playback
# ============================================================
[[commands]]
service = "server"
feature = "music"
id = "play_music"
fast_path_exact = true
exact = ["play music", "play some music", "play spotify"]

[[commands]]
service = "server"
feature = "music"
id = "resume"
fast_path_exact = true
exact = ["resume music", "resume the music", "resume spotify", "resume"]

[[commands]]
service = "server"
feature = "music"
id = "pause"
fast_path_exact = true
exact = ["pause music", "pause the music", "pause spotify", "pause", "stop music", "stop the music", "stop spotify"]

[[commands]]
service = "server"
feature = "music"
id = "next"
fast_path_exact = true
exact = ["next", "next song", "next track", "skip song", "skip track", "skip this song"]

[[commands]]
service = "server"
feature = "music"
id = "previous"
fast_path_exact = true
exact = ["previous", "previous song", "previous track"]

[[commands]]
service = "server"
feature = "music"
id = "set_volume"
[[commands.patterns]]
label = "explicit music volume"
mode = "fullmatch"
fast_path = true
examples = ["music volume 40", "spotify volume 0%", "set the music volume to 100 percent"]
regex = '(?:set )?(?:the )?(?:music|spotify) volume (?:to )?(?P<percent>[+-]?\d[\d.,]*)\s*(?:%|percent)?'
[[commands.patterns]]
label = "malformed numeric setting guard"
mode = "fullmatch"
regex = '(?:set )?(?:the )?(?:music|spotify) volume (?:to )?\S.*'

# Deterministic names; all search/execution stays in the backend.
[[commands]]
service = "server"
feature = "music"
id = "play_request"
[[commands.patterns]]
label = "typed music name"
mode = "fullmatch"
fast_path = true
examples = ["play artist pink floyd", "play playlist evening chill", "play track blinding lights"]
regex = 'play (?P<kind>artist|playlist|track) (?P<query>\S.*)'
[[commands.patterns]]
label = "personal playlist name"
mode = "fullmatch"
fast_path = true
examples = ["play my discover weekly"]
regex = 'play (?P<personal>my) (?!.* by )(?P<query>\S.*)'
[[commands.patterns]]
label = "track qualified by artist"
mode = "fullmatch"
fast_path = true
examples = ["play blinding lights by the weeknd", "play don't stop me now by queen"]
regex = 'play (?!artist |playlist |track )(?P<query>\S.*?) by (?P<artist>\S.*)'
